# Serve profile for the production c8r lane (image: vllm-dspark-runtime:v0261-main-c8r —
# full-source vLLM main @48bada6ea4 + gx10 overlay0261 + #49731 revert, built by
# patches/vllm-0261-main-c8r/; promoted 2026-08-11 on a throughput-parity warm gate vs
# cand7 — see docs/14). Local adaptations vs a stock serve command:
#   - container_name vllm-dsv4 (stable name for preflight/metrics/stop)
#   - API --host/--port env-driven, defaults 127.0.0.1:8000 (loopback-only)
#   - breakable-cudagraph kept on, Triton/TileLang/vLLM cache roots pinned to the
#     persistent bind under the -c8r set (full-source version string; own roots)
#   - CUDA-graph capture ceiling on the *2 formula (see docs/08)
#   - KV pool pinned via --kv-cache-memory-bytes (when KV_CACHE_MEMORY_BYTES is set) —
#     on c8r the same 19.85 GiB pin yields 3,027,217 tokens (+2.7% vs cand7 via #48993
#     MXFP4 indexer packing). See docs/08 / docs/14.
#   - a MemAvailable-margin wait loop in the command preamble blocks `vllm serve` until free
#     memory clears util-required + MEM_MARGIN_GIB — prevents a thin-memory worker from dying
#     mid-rendezvous and desyncing its restart generation from the peer (2026-07-15 incident).
#   - the command preamble's PATH/CUDA_HOME/vllm-binary paths are the image's
#     OWN internal layout (/usr/local/cuda, /usr/local/bin/vllm) — same as the 0.26 gx10
#     lineage. Do not copy the old 0.21.x lane's preamble (/opt/env/...) verbatim.
#   - async scheduling OFF via --no-async-scheduling (standing since 0.26, 2026-07-28;
#     docs/10). Two traps: omitting the flag does NOT disable async (tri-state default
#     resolves to enabled), and `#` comments inside this folded command scalar comment
#     out everything after them — keep rationale here, never inside the argv.
# Rollback rungs (cand7, cand4, 0.25.1, 0.21.x) live in cluster.env.example + docs/08–13.
services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE:-vllm-dspark-runtime:v0261-main-c8r}
    pull_policy: if_not_present   # the tag is built locally and unpublishable — never try to pull it
    # REQUIRED for the gx10 base: neutralizes its baked ENTRYPOINT so `command: bash -lc`
    # below runs directly. Without this, the container double-execs (baked entrypoint wraps
    # `bash -lc`) and crash-loops on startup. The prior 0.21.x lane's base did not need this.
    entrypoint: []
    container_name: vllm-dsv4
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      # Full-source c8r image keeps its OWN cache root (2026-08-11 promotion): the
      # compile cache keys on version+config, never model source — shared roots silently
      # reuse stale graphs across image swaps. Rollback to cand7 ⇒ vllm-cache-cand7
      # (and the TRITON/TILELANG roots below at theirs); cand4 ⇒ vllm-cache.
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache-c8r
      # LEGACY no-op on the 0.26+/c8r lane (verified 2026-08-10: zero readers in the installed
      # vllm package — the crash class it guarded is handled by the overlay's own
      # request-stable draft-KV slot mapping). Kept for harmlessness and 0.25.1-rollback
      # compatibility, where it was live. See docs/LONG_CONTEXT_CRASH_FIX.md.
      DSPARK_SLOT_CLAMP: "${DSPARK_SLOT_CLAMP:-1}"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"

      # 0 (default) keeps vLLM's guard that MAX_MODEL_LEN cannot exceed the model's
      # derived ceiling (== 65536*16 for this model). Set 1 only to deliberately
      # extrapolate past calibration (unsupported); 0 removes that latent footgun.
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-0}"
      # DEAD ON THIS IMAGE (0.26+ / c8r, verified inert — unknown-env-var boot-log sweep
      # 2026-07-25): VLLM_TRITON_MLA_SPARSE, VLLM_SKIP_INIT_MEMORY_CHECK,
      # VLLM_USE_B12X_WO_PROJECTION, and the whole VLLM_DSPARK_*/VLLM_DSV4_* ablation family
      # (gx10-fork experiments, proven no-ops here). Kept out of the environment so the boot
      # log's unknown-var count stays meaningful; resurrect only for a targeted ablation.
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-0}"
      # Per-step model-execute timeout; a larger value tolerates long cudagraph
      # capture / first-step compiles at 1M context without a spurious abort.
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-300}"

      # FlashInfer sampler: part of the DSpark garble fix AND hang-safe on this lane —
      # c8r pins FlashInfer 0.6.16.post3 (native on main; #3615 lineage). See docs/08, docs/14.
      VLLM_USE_FLASHINFER_SAMPLER: "${VLLM_USE_FLASHINFER_SAMPLER:-1}"
      # vLLM 0.25.1 auto-enables the breakable CUDA-graph path for DeepSeek-V4 (no
      # @support_torch_compile); =1 IS the supported route for this model. Keep =1.
      # (=0 was ablated in-band 2026-07-16: boots and runs at baseline throughput/acceptance/
      # KV — an earlier out-of-band "collapse" datapoint proved to be a capture artifact.
      # Neither a lever nor a trap; we keep the documented default. See docs/08.)
      VLLM_USE_BREAKABLE_CUDAGRAPH: "${VLLM_USE_BREAKABLE_CUDAGRAPH:-1}"

      # Set-but-inert on 0.26 (defined, never consumed — the MXFP4 oracle auto-selects
      # DEEPGEMM_MXFP4; see docs/11). Kept for the 0.25.1 rollback lane, where it was live.
      VLLM_USE_B12X_MOE: "${VLLM_USE_B12X_MOE:-1}"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "${VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM:-0}"
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "${VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M:-16}"
      VLLM_B12X_W4A16_FORCE_TILE_CONFIG: "${VLLM_B12X_W4A16_FORCE_TILE_CONFIG:-}"
      B12X_W4A16_TC_DECODE: "${B12X_W4A16_TC_DECODE:-0}"

      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_DISABLE_VERSION_CHECK: "${FLASHINFER_DISABLE_VERSION_CHECK:-1}"
      # Persist FlashInfer's JIT/autotune workspace on the mount (container-ephemeral otherwise).
      FLASHINFER_WORKSPACE_BASE: "${FLASHINFER_WORKSPACE_BASE:-/cache/huggingface/flashinfer}"
      TILELANG_CLEANUP_TEMP_FILES: "${TILELANG_CLEANUP_TEMP_FILES:-1}"
      TILELANG_CACHE_DIR: "${TILELANG_CACHE_DIR:-/cache/huggingface/tilelang-c8r}"   # -c8r root: see the VLLM_CACHE_ROOT note above
      # Triton kernel cache MUST be on the persistent bind: under breakable-cudagraph vLLM's
      # cache-redirect never runs, so an unset value falls through to container-ephemeral
      # /root/.triton/cache and cold-recompiles on every container recreate. See docs/07, docs/08.
      TRITON_CACHE_DIR: "${TRITON_CACHE_DIR:-/cache/huggingface/triton-cache-c8r}"   # -c8r root: same rule
      DG_JIT_USE_NVRTC: "${DG_JIT_USE_NVRTC:-0}"
      DG_JIT_NVCC_COMPILER: "${DG_JIT_NVCC_COMPILER:-/usr/local/cuda/bin/nvcc}"  # gx10 image path; the prior 0.21.x lane's was /opt/env/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"   # TP control plane rides the same rail
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"           # our GIDs are RoCEv2 IPv4
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"       # RoCEv2
      NCCL_IB_ADDR_RANGE: "${NCCL_IB_ADDR_RANGE:-}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-2}"

      # Reasoning toggle (see docs/06). on (default) = server-default thinking + the official
      # V4-Flash reasoning sampling (temp/top_p 1.0); off = non-think greedy, byte-identical to the
      # original tuned recipe. Effort: high (default) or max (max needs MAX_MODEL_LEN>=393216).
      # Optional: add ,"drop_thinking":false to the on-branch CHAT_KWARGS below to also preserve
      # prior-turn CoT on non-tool multi-turn turns (upstream default True drops it; tool turns
      # are always preserved by the encoder). A/B-gated throughput-neutral 2026-08-10 — see
      # docs/06. Cost when enabled: longer prompts on multi-turn sessions.
      DSPARK_REASONING: "${DSPARK_REASONING:-on}"
      DSPARK_REASONING_EFFORT: "${DSPARK_REASONING_EFFORT:-high}"

    # NOTE: keep BOTH --generation-config vllm and --override-generation-config — complementary, not
    # redundant (vllm ignores the model's generation_config.json; override overlays sampling). Part of
    # the agent-garble fix. The reasoning toggle below builds CHAT_KWARGS/GEN_OVERRIDE in-shell.
    command:
      - bash
      - -lc
      - >
        [ -n "$${NCCL_IB_GID_INDEX:-}" ] || unset NCCL_IB_GID_INDEX;
        export PATH="/usr/local/cuda/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/usr/local/cuda}";
        export CUDA_PATH="$${CUDA_PATH:-$${CUDA_HOME}}";
        export CUDAToolkit_ROOT="$${CUDAToolkit_ROOT:-$${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}";
        SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"num_speculative_tokens\":${MTP_NUM_TOKENS:-2},\"draft_sample_method\":\"probabilistic\"}";
        if [ "$${DSPARK_REASONING:-on}" = "on" ]; then CHAT_KWARGS="{\"thinking\":true,\"reasoning_effort\":\"$${DSPARK_REASONING_EFFORT:-high}\"}"; GEN_OVERRIDE="{\"temperature\":1.0,\"top_p\":1.0}"; else CHAT_KWARGS="{\"thinking\":false}"; GEN_OVERRIDE="{\"temperature\":0.0,\"top_p\":1.0}"; fi;
        MEMTOTAL_KB="$$(awk '/^MemTotal:/{print $$2}' /proc/meminfo)";
        REQUIRED_KB="$$(awk -v t="$$MEMTOTAL_KB" -v u="${GPU_MEMORY_UTILIZATION:-0.85}" 'BEGIN{printf "%d", t*u}')";
        MARGIN_KB=$$((${MEM_MARGIN_GIB:-3} * 1024 * 1024));
        NEEDED_KB=$$((REQUIRED_KB + MARGIN_KB));
        echo "== waiting for MemAvailable >= $$((NEEDED_KB/1024/1024)) GiB (util=${GPU_MEMORY_UTILIZATION:-0.85} + ${MEM_MARGIN_GIB:-3}GiB margin) before launching vllm serve — avoids the request_memory() race (a worker launched into a thin margin can die mid-rendezvous and desync its restart generation from the peer, which is loading a ~200s checkpoint on a fixed generation)";
        for i in $$(seq 1 ${MEM_WAIT_MAX_ATTEMPTS:-120}); do
          AVAIL_KB="$$(awk '/^MemAvailable:/{print $$2}' /proc/meminfo)";
          if [ "$$AVAIL_KB" -ge "$$NEEDED_KB" ]; then echo "== memory margin cleared: $$((AVAIL_KB/1024/1024)) GiB available (attempt $$i/${MEM_WAIT_MAX_ATTEMPTS:-120})"; break; fi;
          if [ "$$i" -eq "${MEM_WAIT_MAX_ATTEMPTS:-120}" ]; then echo "== WARNING: memory margin never cleared after ${MEM_WAIT_MAX_ATTEMPTS:-120} attempts; proceeding anyway — vLLM's own request_memory() check will likely fail cleanly"; fi;
          sleep ${MEM_WAIT_POLL_SECONDS:-5};
        done;
        exec /usr/local/bin/vllm serve ${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
        --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash-dspark}
        --host ${VLLM_HOST:-127.0.0.1}
        --port ${API_PORT:-8000}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype ${KV_CACHE_DTYPE:-nvfp4_ds_mla}
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN:-1048576}
        --max-num-seqs ${MAX_NUM_SEQS:-12}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --long-prefill-token-threshold ${LONG_PREFILL_TOKEN_THRESHOLD:-0}
        --shutdown-timeout ${SHUTDOWN_TIMEOUT:-30}
        --max-cudagraph-capture-size ${MAX_CUDAGRAPH_CAPTURE_SIZE:-72}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.85}
        ${KV_CACHE_MEMORY_BYTES:+--kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES}}
        --enable-prefix-caching
        --enable-prompt-tokens-details
        --no-async-scheduling
        --enable-chunked-prefill
        --speculative-config "$${SPECULATIVE_CONFIG}"
        --tokenizer-mode deepseek_v4
        --attention-config '{"backend":"FLASHINFER_MLA_SPARSE_DSV4"}'
        --distributed-executor-backend mp
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        --default-chat-template-kwargs "$${CHAT_KWARGS}"
        --generation-config vllm
        --override-generation-config "$${GEN_OVERRIDE}"
        --enable-flashinfer-autotune
        --distributed-timeout-seconds ${DISTRIBUTED_TIMEOUT_SECONDS:-900}
        --cpu-distributed-timeout-seconds ${CPU_DISTRIBUTED_TIMEOUT_SECONDS:-900}
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        ${HEADLESS:+--headless}
